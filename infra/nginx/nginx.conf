# Balanceador de carga: distribui as requisições entre as 3 instâncias (round-robin).
events {}
http {
  upstream finance_service {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://finance_service;
      proxy_set_header Host $host;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
      # Mostra na resposta qual instância atendeu (útil para ver o balanceamento).
      add_header X-Upstream $upstream_addr always;
    }
  }
}
